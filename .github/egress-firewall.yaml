# GitHub's egress firewall for the verify and build jobs. It runs outside the runner, so code in a
# job cannot switch it off. GitHub's own artifact, cache, and checkout hosts are allowed by default.
mode: log
allow:
  - api.github.com
  - registry.npmjs.org
  - nodejs.org
  - raw.githubusercontent.com
  - release-assets.githubusercontent.com
  - cdn.playwright.dev
  - playwright.download.prss.microsoft.com
