name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The firewall reads its policy from .github/egress-firewall.yaml, which needs contents: read.
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        timeout-minutes: 2
        run: pnpm exec playwright install chromium

      - name: Check formatting, lint, and types
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Run Storybook interaction and accessibility tests
        run: pnpm test-storybook

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Check the production build in a browser
        run: pnpm run test:production

  # Test tools never run in this job, so a compromised one cannot alter what gets deployed.
  build:
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Check production output
        run: node scripts/check-production-output.mjs

      - name: Prepare GitHub Pages site
        run: |
          cp dist/index.html dist/404.html
          grep -q 'src="/assets/' dist/index.html
          grep -q 'href="/assets/' dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          retention-days: 7

  # Runs only GitHub's deploy action, so it has no use for the firewall or for reading the repository.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
