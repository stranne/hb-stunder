<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8e1d5" />
    <meta name="application-name" content="HB Stunder" />
    <meta name="apple-mobile-web-app-title" content="HB Stunder" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("hb-stunder-color-mode");
        } catch {
          // System appearance still works when storage is unavailable.
        }
        const isDark =
          preference === "dark" ||
          (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.colorMode = isDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = isDark ? "#111110" : "#e8e1d5";
      })();
    </script>
    <title>HB Stunder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
