components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EntityReference:
      type: object
      description: Minimal identifier and display-name shape observed in public BRP
        responses.
      properties:
        id:
          type: integer
        name:
          type: string
    BusinessUnitReference:
      allOf:
        - $ref: "#/components/schemas/EntityReference"
        - type: object
          properties:
            location:
              type: string
            companyNameForInvoice:
              type: string
    BusinessUnit:
      allOf:
        - $ref: "#/components/schemas/BusinessUnitReference"
        - type: object
          description: Public business-unit shape observed from GET /businessunits.
          properties:
            company:
              type: object
              additionalProperties: true
            address:
              type: object
              additionalProperties: true
            currency:
              type: string
            releaseSuspensionProduct:
              type: object
              additionalProperties: true
            settings:
              type: object
              additionalProperties: true
            hasRegisterUnitForInternet:
              type: boolean
    ActivityDuration:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    GroupActivityInstructor:
      allOf:
        - $ref: "#/components/schemas/EntityReference"
        - type: object
          properties:
            isSubstitute:
              type: boolean
    ActivitySlots:
      type: object
      properties:
        total:
          type: integer
        totalBookable:
          type: integer
        reservedForDropin:
          type: integer
        leftToBook:
          type: integer
        leftToBookIncDropin:
          type: integer
        hasWaitingList:
          type: boolean
        inWaitingList:
          type: integer
    ScheduledGroupActivity:
      type: object
      description: Structure observed across a bounded thirteen-day public schedule sample
        for all three business units.
      properties:
        id:
          type: integer
        name:
          type: string
        duration:
          $ref: "#/components/schemas/ActivityDuration"
        groupActivityProduct:
          $ref: "#/components/schemas/EntityReference"
        businessUnit:
          $ref: "#/components/schemas/BusinessUnitReference"
        locations:
          type: array
          description: Rooms or areas assigned to the activity. Each item's `name` is
            the room display name, distinct from the containing business unit name.
          items:
            $ref: "#/components/schemas/EntityReference"
        instructors:
          type: array
          items:
            $ref: "#/components/schemas/GroupActivityInstructor"
        bookableEarliest:
          type: string
          format: date-time
          nullable: true
        bookableLatest:
          type: string
          format: date-time
          nullable: true
        bookableEarliestExtended:
          type: string
          format: date-time
          nullable: true
        bookableLatestExtended:
          type: string
          format: date-time
          nullable: true
        externalMessage:
          type: string
          nullable: true
        internalMessage:
          type: string
          nullable: true
        cancelled:
          type: boolean
        slots:
          $ref: "#/components/schemas/ActivitySlots"
    Asset:
      type: object
      properties:
        reference:
          type: string
        type:
          type: string
        theme:
          type: string
          nullable: true
        contentType:
          type: string
        contentUrl:
          type: string
          format: uri
        imageWidth:
          type: integer
        imageHeight:
          type: integer
        focalPointX:
          type: integer
        focalPointY:
          type: integer
    ProductLabel:
      allOf:
        - $ref: "#/components/schemas/EntityReference"
        - type: object
          properties:
            availableFor:
              type: string
    GroupActivityProduct:
      type: object
      description: Public product shape observed from GET /products/groupactivities?webCategory=2.
      properties:
        id:
          type: integer
        name:
          type: string
        productNumber:
          type: string
        productLabels:
          type: array
          items:
            $ref: "#/components/schemas/ProductLabel"
        businessUnits:
          type: array
          items:
            $ref: "#/components/schemas/BusinessUnitReference"
        description:
          type: string
          nullable: true
        participantsMustPay:
          type: boolean
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        ageLimit:
          type: integer
    SystemSetting:
      type: object
      properties:
        key:
          type: string
        value:
          description: Runtime samples contained boolean, integer, string, and null
            setting values.
          nullable: true
    WebCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
        type:
          type: string
        productType:
          type: string
        highlight:
          type: boolean
        includeInShortcuts:
          type: boolean
        company:
          nullable: true
        businessUnit:
          nullable: true
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        showOnGoActive1ExplorePage:
          type: boolean
        moveToHomePage:
          type: boolean
    BootstrapData:
      type: object
      properties:
        systemSettings:
          type: array
          items:
            $ref: "#/components/schemas/SystemSetting"
        webCategories:
          type: array
          items:
            $ref: "#/components/schemas/WebCategory"
        businessUnits:
          type: array
          items:
            $ref: "#/components/schemas/BusinessUnit"
    GroupActivityInstructorResource:
      allOf:
        - $ref: "#/components/schemas/EntityReference"
        - type: object
          description: Public instructor/resource shape observed from GET /services/groupactivityinstructors.
          properties:
            type:
              type: string
            externalDescription:
              type: string
              nullable: true
            assets:
              type: array
              items:
                $ref: "#/components/schemas/Asset"
    CustomerReference:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
    OrderReference:
      type: object
      properties:
        id:
          type: integer
        lastModified:
          type: string
          format: date-time
        number:
          type: integer
    GroupActivityBookingReference:
      type: object
      properties:
        id:
          type: integer
        order:
          $ref: "#/components/schemas/OrderReference"
    GroupActivityBooking:
      type: object
      description: Booking shape observed in a redacted GET customer group-activity
        bookings response.
      properties:
        additionToEventBooking:
          nullable: true
          description: Observed as null; its non-null type is not yet known.
        businessUnit:
          $ref: "#/components/schemas/BusinessUnitReference"
        checkedIn:
          nullable: true
          description: Observed as null; its non-null type is not yet known.
        customer:
          $ref: "#/components/schemas/CustomerReference"
        duration:
          $ref: "#/components/schemas/ActivityDuration"
        groupActivity:
          $ref: "#/components/schemas/EntityReference"
        groupActivityBooking:
          $ref: "#/components/schemas/GroupActivityBookingReference"
        type:
          type: string
    CreateGroupActivityBookingRequest:
      type: object
      description: JSON request shape observed in a redacted booking request and the
        public web client.
      properties:
        groupActivity:
          type: integer
        allowWaitingList:
          type: boolean
